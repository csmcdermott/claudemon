[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudemon"
version = "0.8.1"
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0",
    "watchdog>=4.0.0",
    "pyobjc-framework-WebKit>=10.0",
]

[project.scripts]
claudemon = "claudemon.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "py2app>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
omit = [
    "claudemon/app.py",
    "claudemon/popover.py",
    "claudemon/statusitem.py",
    "claudemon/watcher.py",
]
